[versions]
kotlin = "2.3.0"
kotlinx-coroutine = "1.10.2"

[plugins]
spring-boot = { id = "org.springframework.boot", version = "4.0.3" }
ktlint = { id = "org.jlleitschuh.gradle.ktlint", version = "12.3.0" }
detekt = { id = "dev.detekt", version = "2.0.0-alpha.2" }

kotlin-jvm = { id = "org.jetbrains.kotlin.jvm", version.ref = "kotlin" }
kotlin-spring = { id = "org.jetbrains.kotlin.plugin.spring", version.ref = "kotlin" }

[libraries]
kotlin-bom = { group = "org.jetbrains.kotlin", name = "kotlin-bom", version.ref = "kotlin" }
kotlinx-coroutine-bom = { group = "org.jetbrains.kotlinx", name = "kotlinx-coroutines-bom", version.ref = "kotlinx-coroutine" }
