spring:
  application:
    name: fantazzk-server
  lifecycle:
    timeout-per-shutdown-phase: 25s
  datasource:
    url: jdbc:postgresql://localhost:54322/postgres
    username: postgres
    password: postgres
  liquibase:
    change-log: classpath:/db/changelog/db.changelog-master.yaml

cors:
  allowed-origins:
    - http://localhost:3000
    - http://localhost:5173

logging:
  level:
    root: INFO
    com.naminhyeok.fantazzk: DEBUG

server:
  shutdown: graceful
  tomcat:
    mbeanregistry:
      enabled: true

management:
  endpoint:
    health:
      probes:
        enabled: true

sentry:
  enabled: false
  dsn: ${SENTRY_DSN:}
  send-default-pii: false

---

spring:
  config:
    activate:
      on-profile: test
  datasource:
    url: jdbc:tc:postgresql:16:///test
    username: test
    password: test

sentry:
  enabled: false

---

spring:
  config:
    activate:
      on-profile: dev
  datasource:
    url: ${DATABASE_URL}
    username: ${DATABASE_USERNAME}
    password: ${DATABASE_PASSWORD}
    hikari:
      maximum-pool-size: 5
      minimum-idle: 0
  liquibase:
    default-schema: dev

sentry:
  enabled: true
  dsn: ${SENTRY_DSN}
  environment: dev

cors:
  allowed-origins:
    - http://localhost:3000
    - http://localhost:5173
    - https://dev-fantazzk.vercel.app

logging:
  structured:
    format:
      console: logstash
  level:
    root: WARN
    org.springframework: WARN
    com.naminhyeok.fantazzk: INFO

management:
  endpoints:
    web:
      exposure:
        include:
          - health
          - prometheus
          - loggers

---

spring:
  config:
    activate:
      on-profile: production
  datasource:
    url: ${DATABASE_URL}
    username: ${DATABASE_USERNAME}
    password: ${DATABASE_PASSWORD}
    hikari:
      maximum-pool-size: 5
      minimum-idle: 0
  liquibase:
    default-schema: production

sentry:
  enabled: true
  dsn: ${SENTRY_DSN}
  environment: production

cors:
  allowed-origins:
    - https://fantazzk-rho.vercel.app

logging:
  structured:
    format:
      console: logstash
  level:
    root: WARN
    org.springframework: WARN
    com.naminhyeok.fantazzk: INFO

management:
  endpoints:
    web:
      exposure:
        include:
          - health
