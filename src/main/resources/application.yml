spring:
  application:
    name: fantazzk-server
  lifecycle:
    timeout-per-shutdown-phase: 25s
  datasource:
    url: jdbc:postgresql://localhost:54322/postgres
    username: postgres
    password: postgres
  liquibase:
    change-log: classpath:/db/changelog/db.changelog-master.yaml

cors:
  allowed-origins:
    - http://localhost:3000
    - http://localhost:5173

logging:
  level:
    root: INFO
    com.naminhyeok.fantazzk: DEBUG

server:
  port: ${PORT:8080}
  shutdown: graceful
  tomcat:
    mbeanregistry:
      enabled: true

management:
  endpoint:
    health:
      probes:
        enabled: true

sentry:
  enabled: false
  dsn: ${SENTRY_DSN:}
  send-default-pii: false

fantazzk:
  supabase:
    url: ${SUPABASE_URL:}
    service-role-key: ${SUPABASE_SERVICE_ROLE_KEY:}
    realtime:
      enabled: ${SUPABASE_REALTIME_ENABLED:false}
      topic-prefix: ${SUPABASE_REALTIME_TOPIC_PREFIX:room}

---

spring:
  config:
    activate:
      on-profile: test
  datasource:
    url: jdbc:tc:postgresql:16:///test
    username: test
    password: test

sentry:
  enabled: false

---

spring:
  config:
    activate:
      on-profile: openapi
  datasource:
    url: jdbc:h2:mem:openapi;MODE=PostgreSQL;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    driver-class-name: org.h2.Driver
    username: sa
    password:
  liquibase:
    enabled: false

sentry:
  enabled: false

---

spring:
  config:
    activate:
      on-profile: dev
  datasource:
    url: ${DATABASE_URL}
    username: ${DATABASE_USERNAME}
    password: ${DATABASE_PASSWORD}
    hikari:
      maximum-pool-size: 5
      minimum-idle: 0
  liquibase:
    default-schema: dev

sentry:
  enabled: true
  dsn: ${SENTRY_DSN}
  environment: dev

cors:
  allowed-origins:
    - http://localhost:3000
    - http://localhost:5173
    - https://dev-fantazzk.vercel.app

logging:
  structured:
    format:
      console: logstash
  level:
    root: WARN
    org.springframework: WARN
    com.naminhyeok.fantazzk: INFO

management:
  endpoints:
    web:
      exposure:
        include:
          - health
          - prometheus
          - loggers

swagger:
  username: ${SWAGGER_USERNAME}
  password: ${SWAGGER_PASSWORD}

---

spring:
  config:
    activate:
      on-profile: production
  datasource:
    url: ${DATABASE_URL}
    username: ${DATABASE_USERNAME}
    password: ${DATABASE_PASSWORD}
    hikari:
      maximum-pool-size: 5
      minimum-idle: 0
  liquibase:
    default-schema: production

sentry:
  enabled: true
  dsn: ${SENTRY_DSN}
  environment: production

cors:
  allowed-origins:
    - https://fantazzk-rho.vercel.app
    - https://web-fe-dev-378143668124.asia-northeast3.run.app/

logging:
  structured:
    format:
      console: logstash
  level:
    root: WARN
    org.springframework: WARN
    com.naminhyeok.fantazzk: INFO

management:
  endpoints:
    web:
      exposure:
        include:
          - health

swagger:
  username: ${SWAGGER_USERNAME}
  password: ${SWAGGER_PASSWORD}
